services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - app-data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/transfers.db

  test:
    build: .
    entrypoint: ["uv", "run"]
    command: ["pytest", "-v"]
    environment:
      - DATABASE_URL=sqlite+aiosqlite://

volumes:
  app-data:
